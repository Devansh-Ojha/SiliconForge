name: SiliconForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Verilator & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator build-essential libfl-dev

      - name: Install Python requirements
        run: |
          pip install --upgrade pip
          pip install pytest rich

      - name: Run Core Test Suite
        run: |
          PYTHONPATH=. python tests/test_siliconforge.py
          PYTHONPATH=. python tests/test_vmm_synthesis.py
          PYTHONPATH=. python tests/test_agent.py

      - name: Run Tournament Demo
        run: |
          PYTHONPATH=. python examples/01_riscv_cache_optimization/run_demo.py
