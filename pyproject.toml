[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siliconforge"
version = "0.1.0"
description = "Isolated, snapshotting, agent-native execution platform for autonomous hardware development"
readme = "README.md"
authors = [{ name = "Devansh Ojha" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0"
]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
siliconforge = "siliconforge.cli.main:main"
